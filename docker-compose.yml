services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-englishquest}
      POSTGRES_USER: ${POSTGRES_USER:-englishquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-englishquest}
    ports:
      - "5432:5432"
    volumes:
      - englishquest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-englishquest} -d ${POSTGRES_DB:-englishquest}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  englishquest_postgres:
