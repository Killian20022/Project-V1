<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mon Monde Endor — Galactic Battlegrounds</title>
<style>
  :root{ --gold:#ffd54a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#0a0e08; overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:#eee; }
  #wrap{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; image-rendering:pixelated;
    image-rendering:crisp-edges; touch-action:none; cursor:grab; }
  canvas.drag{ cursor:grabbing; }
  #hud{ position:fixed; top:12px; left:12px; z-index:5; user-select:none;
    background:rgba(10,16,10,.62); border:1px solid rgba(255,213,74,.35);
    border-radius:12px; padding:10px 14px; backdrop-filter:blur(4px); max-width:min(74vw,360px); }
  #hud h1{ margin:0 0 2px; font-size:16px; letter-spacing:2px; color:var(--gold);
    text-shadow:0 0 10px rgba(255,213,74,.4); }
  #hud .sub{ font-size:11.5px; opacity:.72; line-height:1.35; }
  #bar{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:5;
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .btn{ background:rgba(10,16,10,.7); color:#eee; border:1px solid rgba(255,213,74,.4);
    border-radius:20px; padding:8px 14px; font-size:13px; cursor:pointer; user-select:none;
    transition:all .15s; white-space:nowrap; }
  .btn:hover{ border-color:var(--gold); color:var(--gold); }
  .btn.on{ background:rgba(255,213,74,.16); border-color:var(--gold); color:var(--gold); }
  #hint{ position:fixed; bottom:56px; left:50%; transform:translateX(-50%); z-index:4;
    font-size:11.5px; opacity:.55; pointer-events:none; text-align:center; width:90%; }
  #load{ position:fixed; inset:0; z-index:20; background:#0a0e08; display:flex;
    align-items:center; justify-content:center; flex-direction:column; gap:14px; }
  #load .t{ color:var(--gold); letter-spacing:4px; font-size:20px; }
  #load .b{ width:220px; height:6px; background:#1c241a; border-radius:6px; overflow:hidden; }
  #load .b i{ display:block; height:100%; width:0; background:var(--gold); transition:width .2s; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="hud">
  <h1>MON MONDE ENDOR</h1>
  <div class="sub">Galactic Battlegrounds — <b id="cnt"></b> unités vivantes.
  Glisse pour te déplacer, molette / pincement pour zoomer.</div>
</div>

<div id="hint">Clique-glisse pour explorer la forêt · molette = zoom</div>

<div id="bar">
  <div class="btn" id="bDay">☀️ Jour / Nuit</div>
  <div class="btn on" id="bFly">🚀 Vaisseaux</div>
  <div class="btn on" id="bShots">✨ Combat</div>
  <div class="btn" id="bFit">🔭 Vue d'ensemble</div>
</div>

/* ================= asset loading ================= */
const IMG = {};
function loadAll(cb){
  const entries=[];
  for(const k in SPRITES){
    if(k.startsWith('__')) continue;
    const v=SPRITES[k];
    if(Array.isArray(v)){ v.forEach((s,i)=>entries.push([k+"#"+i,s])); }
    else entries.push([k,v]);
  }
  let done=0; const total=entries.length;
  entries.forEach(([id,src])=>{
    const im=new Image();
    im.onload=im.onerror=()=>{ IMG[id]=im; done++;
      document.getElementById('lb').style.width=(done/total*100)+'%';
      if(done===total) cb();
    };
    im.src=src;
  });
}
function frameCount(k){ return Array.isArray(SPRITES[k])?SPRITES[k].length:1; }
function img(k,f){ return frameCount(k)>1 ? IMG[k+"#"+(f|0)] : (IMG[k]||IMG[k+"#0"]); }

let CW=0,CH=0,DPR=Math.min(devicePixelRatio||1,2);
function resize(){ CW=innerWidth; CH=innerHeight; cv.width=CW*DPR; cv.height=CH*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); }

const B=WORLD.bounds;
const WORLDW=B.x1-B.x0, WORLDH=B.y1-B.y0;
const cam={ x:(B.x0+B.x1)/2, y:(B.y0+B.y1)/2, z:0.2 };
function fitView(){
  cam.z=Math.min(CW/WORLDW, CH/WORLDH)*0.92;
  cam.x=(B.x0+B.x1)/2; cam.y=(B.y0+B.y1)/2;
}
function w2sx(x){ return (x-cam.x)*cam.z + CW/2; }
function w2sy(y){ return (y-cam.y)*cam.z + CH/2; }

/* input: drag + wheel + pinch */
let drag=null;
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
cv.addEventListener('pointermove',e=>{ if(!drag)return;
  cam.x-=(e.clientX-drag.x)/cam.z; cam.y-=(e.clientY-drag.y)/cam.z;
  drag.x=e.clientX; drag.y=e.clientY; });
cv.addEventListener('pointerup',e=>{ drag=null; cv.classList.remove('drag'); });
cv.addEventListener('pointercancel',e=>{ drag=null; cv.classList.remove('drag'); });
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0016);
  const wx=cam.x+(e.clientX-CW/2)/cam.z, wy=cam.y+(e.clientY-CH/2)/cam.z;
  cam.z=Math.max(0.05,Math.min(2.2,cam.z*f));
  cam.x=wx-(e.clientX-CW/2)/cam.z; cam.y=wy-(e.clientY-CH/2)/cam.z;
},{passive:false});
// pinch
let pts=new Map(), pinch=null;
cv.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); });
cv.addEventListener('pointermove',e=>{ if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ drag=null;
    const a=[...pts.values()]; const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
    if(pinch){ const f=d/pinch.d;
      const wx=cam.x+(mx-CW/2)/cam.z, wy=cam.y+(my-CH/2)/cam.z;
      cam.z=Math.max(0.05,Math.min(2.2,cam.z*f));
      cam.x=wx-(mx-CW/2)/cam.z; cam.y=wy-(my-CH/2)/cam.z; }
    pinch={d,mx,my};
  }});
function clearPt(e){ pts.delete(e.pointerId); if(pts.size<2) pinch=null; }
cv.addEventListener('pointerup',clearPt); cv.addEventListener('pointercancel',clearPt);

/* ================= RNG ================= */
function mulberry(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry(1337);

/* ================= entities ================= */
const K = 1.75;       // world units per native sprite pixel (common scale)

const actors=WORLD.actors.map(a=>({
  ...a, phase:rnd()*7, sp:26+rnd()*16, tx:a.x, ty:a.y,
  face:a.d<0?-1:1, next:rnd()*3, moving:false, blink:rnd()*4,
  H: a.creature ? 150 : 120
}));
const vehicles=WORLD.vehicles.map(v=>{
  const range = v.kind==='bike' ? 700 : 520;
  const dirSign = (v.d<0?-1:1);
  return {...v, phase:rnd()*7, t0:v.x, min:v.x-range*rnd(), max:v.x+range*rnd()+120,
    vx:dirSign, face:dirSign, bob:rnd()*6 };
});

const flyers=[];
function spawnFlyer(){
  const k = rnd()<0.5?'xwing':'tie';
  const fromLeft = rnd()<0.5;
  const y = B.y0 + WORLDH*(0.1+rnd()*0.8);
  const speed = 260+rnd()*180;
  flyers.push({ k, x: fromLeft?B.x0-300:B.x1+300, y,
    vx:(fromLeft?1:-1)*speed, vy:(rnd()-0.5)*40, H:150+rnd()*40, wob:rnd()*7 });
}
let flyTimer=1.2;

/* blaster bolts */
const bolts=[];
function maybeShoot(dt,t){
  if(!opt.shots) return;
  if(rnd()> dt*0.9) return;               // ~0.9 shots/sec overall
  const a=actors[(rnd()*actors.length)|0];
  if(!a || a.creature) return;
  const emp = META_ROLE(a.k)==='emp'||META_ROLE(a.k)==='sith';
  // find a target of the opposite faction nearby
  let best=null,bd=1e9;
  for(let i=0;i<actors.length;i++){ const b=actors[i]; if(b===a||b.creature)continue;
    const be = META_ROLE(b.k)==='emp'||META_ROLE(b.k)==='sith';
    if(be===emp) continue;
    const d=(a.x-b.x)**2+(a.y-b.y)**2; if(d<bd && d<650*650){bd=d;best=b;} }
  if(!best) return;
  const ang=Math.atan2(best.y-a.y,best.x-a.x);
  bolts.push({ x:a.x, y:a.y-60, vx:Math.cos(ang)*900, vy:Math.sin(ang)*900,
    life:0.7, col: emp?'#ff4033':'#4bff5a' });
  a.face = best.x<a.x?-1:1;
}
const ROLE={};
(function(){ const r=SPRITES.__roles__||{}; for(const k in r) ROLE[k]=r[k]; })();
function META_ROLE(k){ return ROLE[k]||'reb'; }

/* ================= ground texture (baked once) ================= */
let ground;
function bakeGround(){
  const GR=0.34;
  const gw=Math.max(64,Math.round(WORLDW*GR)), gh=Math.max(64,Math.round(WORLDH*GR));
  ground=document.createElement('canvas'); ground.width=gw; ground.height=gh;
  const g=ground.getContext('2d');
  // base forest gradient
  const grd=g.createLinearGradient(0,0,0,gh);
  grd.addColorStop(0,'#41613a'); grd.addColorStop(0.5,'#3a5733'); grd.addColorStop(1,'#324b2c');
  g.fillStyle=grd; g.fillRect(0,0,gw,gh);
  const R=mulberry(99);
  // soft clearings / shade blotches
  for(let i=0;i<Math.round(gw*gh/900);i++){
    const x=R()*gw,y=R()*gh,r=6+R()*40;
    g.globalAlpha=0.05+R()*0.12;
    g.fillStyle = R()<0.5?'#2c4526':'#4d6b40';
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  // grass speckle
  g.globalAlpha=0.5;
  for(let i=0;i<gw*gh/22;i++){
    const x=R()*gw,y=R()*gh;
    g.fillStyle = R()<0.5?'rgba(80,110,60,.5)':'rgba(40,60,34,.5)';
    g.fillRect(x,y,1,1+R()*1.5);
  }
  // dirt paths hint
  g.globalAlpha=0.10; g.strokeStyle='#6b5a3c'; g.lineWidth=gh*0.012;
  for(let i=0;i<4;i++){ g.beginPath(); let x=R()*gw,y=0;
    g.moveTo(x,y); for(let s=0;s<8;s++){ x+=(R()-0.5)*gw*0.25; y+=gh/8; g.lineTo(x,y);} g.stroke(); }
  g.globalAlpha=1;
}

/* ================= decor drawing ================= */
function shadow(sx,sy,rx,ry){ ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx,sy,rx,ry,0,0,7); ctx.fill(); ctx.restore(); }

function drawTree(sx,sy,z,t,seed){
  const s=z; const sway=Math.sin(t*0.9+seed)*3*s;
  shadow(sx,sy,22*s,7*s);
  // trunk (redwood)
  ctx.fillStyle='#5b3d24'; ctx.fillRect(sx-4*s, sy-70*s, 8*s, 70*s);
  ctx.fillStyle='#6f4a2c'; ctx.fillRect(sx-4*s, sy-70*s, 3*s, 70*s);
  // canopy layers
  const layers=[[-150,34],[-110,42],[-66,38]];
  for(let i=0;i<layers.length;i++){ const [oy,r]=layers[i];
    ctx.fillStyle= i===0?'#2f5027': i===1?'#356029':'#3d6e2f';
    ctx.beginPath();
    ctx.moveTo(sx+sway*(1-i*0.3), sy+oy*s-r*0.7*s);
    ctx.lineTo(sx-r*s+sway*(1-i*0.3), sy+oy*s+r*0.7*s);
    ctx.lineTo(sx+r*s+sway*(1-i*0.3), sy+oy*s+r*0.7*s);
    ctx.closePath(); ctx.fill();
  }
}
function drawFern(sx,sy,z,t,seed){ const s=z; shadow(sx,sy,12*s,4*s);
  ctx.strokeStyle='#3f7a34'; ctx.lineWidth=2.2*s; ctx.lineCap='round';
  for(let i=-2;i<=2;i++){ const a=-Math.PI/2+i*0.42+Math.sin(t*1.4+seed+i)*0.05;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(a)*20*s, sy+Math.sin(a)*20*s); ctx.stroke(); }
}
function drawRock(sx,sy,z){ const s=z; shadow(sx,sy,16*s,6*s);
  ctx.fillStyle='#7d7f82'; ctx.beginPath(); ctx.ellipse(sx,sy-8*s,17*s,13*s,0,0,7); ctx.fill();
  ctx.fillStyle='#9a9ca0'; ctx.beginPath(); ctx.ellipse(sx-4*s,sy-12*s,8*s,6*s,0,0,7); ctx.fill();
  ctx.fillStyle='#5f6165'; ctx.beginPath(); ctx.ellipse(sx+6*s,sy-4*s,7*s,5*s,0,0,7); ctx.fill();
}
function drawFire(sx,sy,z,t,seed){ const s=z;
  // logs
  ctx.fillStyle='#5b3d24'; ctx.fillRect(sx-12*s,sy-3*s,24*s,5*s);
  ctx.fillStyle='#6f4a2c'; ctx.save(); ctx.translate(sx,sy); ctx.rotate(0.5); ctx.fillRect(-12*s,-2*s,24*s,4*s); ctx.restore();
  // flame flicker
  const f=0.7+0.3*Math.sin(t*11+seed)+0.2*Math.sin(t*17+seed*2);

    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(sx,sy-14*s,90*s,0,7); ctx.fill(); ctx.restore(); }
  for(let i=0;i<3;i++){ const h=(20+i*6)*s*f, w=(9-i*2)*s;
    ctx.fillStyle=['#ff7a1a','#ffb03a','#ffe27a'][i];
    ctx.beginPath(); ctx.moveTo(sx-w,sy-4*s); ctx.quadraticCurveTo(sx,sy-h*1.4,sx+w,sy-4*s);

  ctx.fillStyle='#43484a'; ctx.fillRect(sx-8*s,sy-58*s,5*s,58*s);
  ctx.fillStyle='#6b7173'; ctx.fillRect(sx-15*s,sy-72*s,30*s,16*s);
  ctx.fillStyle='#2b2f30'; ctx.fillRect(sx-15*s,sy-64*s,30*s,4*s);
  ctx.fillStyle='#9aa0a2'; ctx.fillRect(sx-2*s,sy-86*s,4*s,14*s);
}
function command(sx,sy,z){ const s=z; shadow(sx,sy,44*s,12*s);
  ctx.fillStyle='#4c5153'; ctx.fillRect(sx-40*s,sy-40*s,80*s,40*s);
  ctx.fillStyle='#5c6264'; ctx.fillRect(sx-40*s,sy-52*s,80*s,14*s);
  ctx.fillStyle='#3a3f40'; for(let i=-34;i<40;i+=14) ctx.fillRect(sx+i*s,sy-34*s,8*s,30*s);
  ctx.fillStyle='#8a9092'; ctx.beginPath(); ctx.moveTo(sx-40*s,sy-52*s); ctx.lineTo(sx,sy-70*s); ctx.lineTo(sx+40*s,sy-52*s); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c33'; ctx.fillRect(sx-3*s,sy-84*s,6*s,14*s);
}
function entrance(sx,sy,z){ const s=z; shadow(sx,sy,30*s,9*s);
  ctx.fillStyle='#4c5153'; ctx.fillRect(sx-30*s,sy-46*s,10*s,46*s); ctx.fillRect(sx+20*s,sy-46*s,10*s,46*s);
  ctx.fillStyle='#6b7173'; ctx.fillRect(sx-30*s,sy-52*s,60*s,8*s);
  ctx.fillStyle='#2b2f30'; ctx.fillRect(sx-20*s,sy-40*s,40*s,40*s);
}
function drawDecor(d,t){
  const sx=w2sx(d.x), sy=w2sy(d.y), z=cam.z, seed=d.x*0.01+d.y*0.013;
  switch(d.t){
    case 'tree': drawTree(sx,sy,z,t,seed); break;
    case 'fern': drawFern(sx,sy,z,t,seed); break;
    case 'rock': drawRock(sx,sy,z); break;
    case 'fire': drawFire(sx,sy,z,t,seed); break;
    case 'hut': hut(sx,sy,z); break;
    case 'shelter': shelter(sx,sy,z); break;
    case 'bunker': bunker(sx,sy,z); break;
    case 'tower': tower(sx,sy,z); break;
    case 'command': command(sx,sy,z); break;
    case 'entrance': entrance(sx,sy,z); break;
  }
}

/* ================= sprite drawing ================= */
function drawSprite(im,sx,sy,worldH,z,face,extraY,rot){
  if(!im||!im.width) return;
  const h=worldH*z, w=h*(im.width/im.height);
  ctx.save(); ctx.translate(sx, sy+ (extraY||0));
  if(rot){ ctx.rotate(rot); }
  if(face<0) ctx.scale(-1,1);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(im, -w/2, -h, w, h);
  ctx.restore();
}

function drawActor(a,t){
  const sx=w2sx(a.x), sy=w2sy(a.y), z=cam.z;
  const bobF = a.moving?7:2.2;
  const bob = Math.abs(Math.sin(t*(a.moving?9:1.7)+a.phase))*bobF*z;
  shadow(sx,sy, (a.creature?18:11)*z, (a.creature?6:4)*z);
  const im=img(a.k,0);
  drawSprite(im,sx,sy,(im?im.height*K:110),z,a.face,-bob);
}

function drawVehicle(v,t){
  const sx=w2sx(v.x), sy=w2sy(v.y), z=cam.z;
  if(v.kind==='walker'){
    const fps= v.k==='atat'?3.2:5;
    const nf=frameCount(v.k);
    const fi=Math.floor(t*fps + v.phase)%nf;
    const bob=Math.sin(t*fps*Math.PI + v.phase)*2*z;
    shadow(sx,sy, (v.k==='atat'?54:26)*z, (v.k==='atat'?12:8)*z);
    const iw=img(v.k,fi); drawSprite(iw,sx,sy,(iw?iw.height*K:180),z,v.face,-bob);
  } else { // speeder bike
    const bob=Math.sin(t*4+v.bob)*3*z;
    shadow(sx,sy+4*z, 20*z, 5*z);
    const iw=img(v.k,0); drawSprite(iw,sx,sy,(iw?iw.height*K:95),z,v.face,-bob);
    // engine trail
    ctx.save(); ctx.globalAlpha=0.35; ctx.strokeStyle='#8fdcff'; ctx.lineWidth=2*z;
    ctx.beginPath(); ctx.moveTo(sx- v.face*24*z, sy-8*z-bob); ctx.lineTo(sx - v.face*54*z, sy-8*z-bob); ctx.stroke(); ctx.restore();
  }
}

function drawFlyer(f){
  const sx=w2sx(f.x), sy=w2sy(f.y), z=cam.z;
  const ang=Math.atan2(f.vy,f.vx)+Math.PI/2; // sprites point "up"
  // ground shadow far below
  ctx.save(); ctx.globalAlpha=0.16; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx, sy+70*z, 26*z, 8*z,0,0,7); ctx.fill(); ctx.restore();
  const iw=img(f.k,0); drawSprite(iw,sx,sy,(iw?iw.height*K*1.4:150),z,1,0,ang);
}

/* ================= update ================= */
function update(dt,t){
  // actors wander
  for(const a of actors){
    a.next-=dt;
    if(a.next<=0){
      a.next= 1.5+rnd()*4;
      if(rnd()<(a.creature?0.5:0.6)){
        const R=a.creature?70:130;
        a.tx=a.hx+(rnd()-0.5)*2*R; a.ty=a.hy+(rnd()-0.5)*2*R;
      } else { a.tx=a.x; a.ty=a.y; }
    }
    const dx=a.tx-a.x, dy=a.ty-a.y, dist=Math.hypot(dx,dy);
    if(dist>4){ a.moving=true; const sp=(a.creature?18:a.sp);
      a.x+=dx/dist*sp*dt; a.y+=dy/dist*sp*dt;
      if(Math.abs(dx)>2) a.face= dx<0?-1:1;
    } else a.moving=false;
  }
  // vehicles patrol
  for(const v of vehicles){
    if(v.kind==='walker'){ const sp=v.sp;
      v.x+=v.vx*sp*dt;
      if(v.x>v.max){v.x=v.max; v.vx=-1; v.face=-1;}
      if(v.x<v.min){v.x=v.min; v.vx=1; v.face=1;}
    } else { const sp=v.sp;
      v.x+=v.vx*sp*dt;
      if(v.x>v.max){v.x=v.max; v.vx=-1; v.face=-1;}
      if(v.x<v.min){v.x=v.min; v.vx=1; v.face=1;}
    }
  }
  // flyers
  if(opt.fly){ flyTimer-=dt; if(flyTimer<=0 && flyers.length<5){ spawnFlyer(); flyTimer=1.6+rnd()*3; } }
  for(let i=flyers.length-1;i>=0;i--){ const f=flyers[i];
    f.x+=f.vx*dt; f.y+=f.vy*dt + Math.sin(t*1.3+f.wob)*6*dt;
    if(f.x<B.x0-500||f.x>B.x1+500) flyers.splice(i,1);
  }
  // bolts
  maybeShoot(dt,t);
  for(let i=bolts.length-1;i>=0;i--){ const b=bolts[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; if(b.life<=0) bolts.splice(i,1);
  }
}

/* ================= render ================= */
let fireflies=[];
for(let i=0;i<80;i++) fireflies.push({x:B.x0+rnd()*WORLDW,y:B.y0+rnd()*WORLDH,ph:rnd()*7});

function render(t){
  // sky/base
  ctx.fillStyle = opt.night ? '#0c1420' : '#6f8f5a';
  ctx.fillRect(0,0,CW,CH);
  // ground blit
  const gx=w2sx(B.x0), gy=w2sy(B.y0), gw=WORLDW*cam.z, gh=WORLDH*cam.z;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(ground, gx,gy,gw,gh);
  if(opt.night){ ctx.fillStyle='rgba(10,18,34,.55)'; ctx.fillRect(gx,gy,gw,gh); }

  // build draw list sorted by base y (painter)
  const list=[];
  for(const d of WORLD.decor) list.push({y:d.y, kind:0, o:d});
  for(const a of actors)      list.push({y:a.y, kind:1, o:a});
  for(const v of vehicles)    list.push({y:v.y+ (v.kind==='walker'?0:0), kind:2, o:v});
  list.sort((p,q)=>p.y-q.y);

  // cull margin
  const M=200;
  for(const it of list){
    const sx=w2sx(it.o.x), sy=w2sy(it.o.y);
    if(sx<-M||sx>CW+M||sy<-M||sy>CH+M) continue;
    if(it.kind===0) drawDecor(it.o,t);
    else if(it.kind===1) drawActor(it.o,t);
    else drawVehicle(it.o,t);
  }
  // bolts
  for(const b of bolts){ const sx=w2sx(b.x), sy=w2sy(b.y);
    ctx.strokeStyle=b.col; ctx.lineWidth=3*cam.z; ctx.lineCap='round';
    ctx.shadowColor=b.col; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx-b.vx*0.012*cam.z, sy-b.vy*0.012*cam.z); ctx.stroke();
    ctx.shadowBlur=0;
  }
  // flyers on top
  if(opt.fly) for(const f of flyers) drawFlyer(f);

  // night fireflies
  if(opt.night){ for(const ff of fireflies){ const sx=w2sx(ff.x), sy=w2sy(ff.y);
    if(sx<0||sx>CW||sy<0||sy>CH) continue;
    const gl=0.4+0.6*Math.sin(t*2+ff.ph);
    ctx.fillStyle='rgba(190,255,120,'+(0.35*gl)+')';
    ctx.beginPath(); ctx.arc(sx,sy,2*cam.z+1,0,7); ctx.fill();
  }}
  // subtle vignette
  const vg=ctx.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*0.4,CW/2,CH/2,Math.max(CW,CH)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1, opt.night?'rgba(0,0,0,.55)':'rgba(0,0,0,.28)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,CW,CH);
}

/* ================= main loop ================= */
let last=performance.now()/1000, acc=0;
function frame(now){
  now/=1000; let dt=now-last; last=now; if(dt>0.05) dt=0.05; acc+=dt;
  update(dt, acc);
  render(acc);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
loadAll(()=>{
  bakeGround(); fitView();
  document.getElementById('cnt').textContent=(actors.length+vehicles.length);
  document.getElementById('load').style.display='none';
  requestAnimationFrame(frame);
});
</script>
</body>
